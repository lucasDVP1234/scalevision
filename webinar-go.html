<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SCALEVISION — Webinaire Gratuit · 12 Avril</title>
</head>
<body>
<script>
var v = localStorage.getItem('ab-webinar');
if (!v) {
  v = Math.random() < 0.5 ? 'a' : 'b';
  localStorage.setItem('ab-webinar', v);
}
var params = new URLSearchParams(location.search);
params.set('variant', v);
var dest = v === 'a' ? '/webinar.html' : '/webinar-b.html';
location.replace(dest + '?' + params.toString());
</script>
</body>
</html>
